<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DR.DOCK</title>
<!-- link preview (Open Graph · Twitter): public/og-image.png -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://drdock-magni-1.netlify.app/">
<meta property="og:title" content="DR.DOCK">
<meta property="og:description" content="DT 기반 선체 외판 보수 지원 시스템">
<meta property="og:image" content="https://drdock-magni-1.netlify.app/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" sizes="32x32" href="/src/assets/favicon.png">
<link rel="icon" type="image/png" sizes="16x16" href="/src/assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/src/assets/apple-touch-icon.png">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><img class="brand-logo" src="/src/assets/logo.png" alt="DR.DOCK"></div>
    <!-- screens (SPEC 12.2): 진단 = the dashboard · 보수 계획 = plan/view.js -->
    <div class="seg view-tabs" role="tablist" aria-label="화면">
      <button role="tab" id="tabDiag" data-screen="diag" aria-selected="true" aria-controls="diagView">진단</button>
      <button role="tab" id="tabPlan" data-screen="plan" aria-selected="false" aria-controls="planView" aria-disabled="true" class="is-disabled" tabindex="-1">보수</button>
    </div>
    <div class="top-right">
      <!-- ship + docking: one bundle, a thin divider between -->
      <div class="field ship-dock"><span class="ship" aria-label="선박"><b>H-2491</b></span><i class="vsep" aria-hidden="true"></i>
        <label class="sr-only" for="dockSel">도킹</label>
        <select id="dockSel">
          <option value="current">2026.10 2차 리도킹·2번 도크 (현재)</option>
          <option value="first">2021.10 1차 리도킹</option>
          <option value="newbuild">2016.10 신조 인도</option>
        </select>
      </div>
      <div class="map-toggle" id="mapToggle">
        <span class="map-state" id="mapState" role="status"><i></i><svg class="ic ok" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-6.5"/></svg><span id="mapStateTxt">매핑 완료</span><span class="map-prog" aria-hidden="true"><i></i></span></span>
        <button class="btn-primary secondary" id="mapBtn">재매핑</button>
      </div>
      <!-- outputs by screen (SPEC 13.1): 진단 = 진단 보고서 (5장) · 보수 계획 = 자재 발주 목록 Excel + 보수 도면 (2장, plan/view.js) -->
      <button class="btn-ghost" id="reportBtn">진단 보고서(PDF)</button>
      <button class="btn-ghost" id="xlsxBtn">자재 발주 목록(Excel)</button>
      <button class="btn-ghost" id="planPdfBtn">보수 도면(PDF)</button>
    </div>
  </header>

  <div class="main" id="diagView">
    <section class="pane pane-3d" id="pane3d" aria-label="3D 선체 외판">
      <div class="pane-head">
        <span class="pane-title">3D 선체 외판</span>
        <button class="help-btn" id="legendBtn" aria-expanded="false" aria-controls="legendPop" aria-label="범례" title="범례">?</button>
      </div>
      <div class="pop" id="legendPop" role="dialog" aria-label="범례" hidden>
        <b class="lg-ttl" id="lgTitle"></b>
        <div class="lg-row lg-one" id="lgTop"></div>
        <div class="lg-row" id="lgCrit"></div>
        <div class="lg-row" id="lgWarn"></div>
        <div class="lg-row"><i class="sw-hull"></i><span>정상</span><i class="hatch"></i><span>측정 불가</span></div>
      </div>
      <div class="pane-body">
        <div id="vp"></div>
        <div id="labels"></div>

        <div class="ov-tools">
          <div class="seg" role="group" aria-label="측정 레이어">
            <span class="lbl">레이어</span>
            <button data-layer="plate" aria-pressed="true">강판 두께</button>
            <button data-layer="dft" aria-pressed="false">도막 두께</button>
            <button data-layer="defect" aria-pressed="false">도막 손상</button>
          </div>
          <div class="seg" role="group" aria-label="시점">
            <span class="lbl">View</span>
            <button data-view="iso" aria-pressed="true">ISO</button>
            <button data-view="side" aria-pressed="false">측면</button>
            <button data-view="plan" aria-pressed="false">평면</button>
            <button data-view="front" aria-pressed="false">정면</button>
            <button data-view="bottom" aria-pressed="false">선저</button>
            <span class="sep" aria-hidden="true"></span>
            <button data-look="real" aria-pressed="true">실선</button>
            <button data-look="bp" aria-pressed="false">도면</button>
          </div>
          <div class="seg" role="group" aria-label="재생 속도 (시연용)" id="speedSeg" hidden>
            <span class="lbl">Speed</span>
            <button data-speed="1" aria-pressed="false">×1</button>
            <button data-speed="10" aria-pressed="true">×10</button>
            <button data-speed="50" aria-pressed="false">×50</button>
          </div>
          <button class="chip-back" id="followBtn" hidden title="매핑 중 로봇이 있는 면으로 카메라를 다시 돌립니다"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><circle cx="8" cy="8" r="1.6"/><path d="M8 .8v2.4M8 12.8v2.4M.8 8h2.4M12.8 8h2.4"/></svg>로봇 따라가기</button>
          <button class="chip-back" id="flyBack" hidden>← 선박 전체 보기</button>
        </div>

        <!-- bottom left: LAYERS and the frame card side by side on one bottom line; both start folded and open upwards -->
        <div class="ov-dock" id="ovDock">
          <details class="ov ov-layers" id="layers">
            <summary>Layers<svg class="ic chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 10l4-4 4 4"/></svg></summary>
            <ul>
              <li><label class="tog"><input type="checkbox" id="lyFrames" checked>프레임선<span class="sw" style="background:#8A96AA"></span></label></li>
              <li><label class="tog"><input type="checkbox" id="lySeams" checked>외판열 경계<span class="sw" style="background:#5E6B82"></span></label></li>
              <li><label class="tog"><input type="checkbox" id="lyDwl" checked>설계 흘수선<span class="sw" style="background:#4A6FB0"></span></label></li>
              <li><label class="tog"><input type="checkbox" id="lyRobot" checked>로봇 주행경로<span class="sw dash"></span></label></li>
              <li><label class="tog"><input type="checkbox" id="lySuper" checked>상부 구조</label></li>
              <li><label class="tog"><input type="checkbox" id="lyBlocks" checked>도크·킬 블록</label></li>
              <li><label class="tog"><input type="checkbox" id="lyZones">구역 경계<span class="sw dash2"></span></label></li>
            </ul>
          </details>
          <div class="ov ov-sec collapsed" id="secCard">
            <button class="sec-mini" id="secExpand" aria-label="프레임 정보 펼치기" title="펼치기"><small>FR</small><span id="secMiniFr">170</span><svg class="ic chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 10l4-4 4 4"/></svg></button>
            <div class="row1"><label class="fr"><small>FR</small><input id="secFr" value="170" inputmode="numeric" autocomplete="off" spellcheck="false" aria-label="프레임 번호 (입력 후 Enter)" title="클릭해서 입력·Enter로 이동"></label>
              <label class="tog"><input type="checkbox" id="cutTog">단면 절단</label>
              <button class="icon-btn sm" id="secCollapse" aria-label="프레임 정보 접기" title="접기"><svg class="ic chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 10l4-4 4 4"/></svg></button></div>
            <dl class="kv">
              <dt>선체 부위</dt><dd><span class="zone" id="secZone">평행 중앙부</span></dd>
              <dt>X</dt><dd id="secX">144.50 m</dd>
              <dt>반폭 @ 설계흘수</dt><dd id="secHb">23.20 m</dd>
              <dt>외판 거스</dt><dd id="secG">48.6 m</dd>
              <dt>외판열</dt><dd id="secS">K, A–N</dd>
            </dl>
            <input class="slider" type="range" id="secSlider" min="0" max="351" value="170" aria-label="단면 프레임 번호">
          </div>
        </div>


        <div class="ov ov-gizmo"><canvas id="gizmo" aria-label="좌표축"></canvas></div>
        <div class="tip" id="tip" hidden></div>
      </div>
    </section>

    <section class="pane pane-shell" id="paneShell" aria-label="S.SHELL 전개도">
      <div class="pane-head">
        <span class="pane-title">S.SHELL 전개도</span>
      </div>
      <div class="pane-body"></div>
    </section>

    <section class="pane pane-detail" id="paneDetail" aria-label="상세 이미지">
      <div class="pane-head">
        <span class="pane-title">상세 이미지</span>
      </div>
      <div class="pane-body"></div>
    </section>

    <div class="col-side">
      <section class="pane pane-kpi" id="paneKpi" aria-label="KPI 핵심 지표">
        <div class="pane-head">
          <span class="pane-title">KPI 핵심 지표</span>
        </div>
        <div class="pane-body"></div>
      </section>
      <section class="pane pane-list" id="paneList" aria-label="보수 목록">
        <div class="pane-head">
          <span class="pane-title">보수 목록</span><span class="pane-count" id="listCount"></span>
          <button class="help-btn sm" id="valBtn" aria-expanded="false" aria-controls="valPop" aria-label="수치 설명" title="수치 설명">?</button>
        </div>
        <div class="pane-body"></div>
      </section>
    </div>
  </div>

  <!-- 보수 계획 (SPEC 13): top 보수 범위 설정 | 보수 물량 및 효과 · bottom 보수 도면 | 보수 정보 — the right column one width.
       보수 도면 maximizes only, the others fold only — the grid follows the folding (plan/layout.js).
       보수 이력 (a past docking): no 보수 범위 설정, 보수 물량 및 효과 takes the whole top row -->
  <div class="plan" id="planView" role="tabpanel" aria-labelledby="tabPlan" hidden>
    <section class="pane pane-range" id="paneRange" aria-label="보수 범위 설정">
      <div class="pane-head"><span class="pane-title">보수 범위 설정</span></div>
      <div class="pane-body">
        <div class="rg" id="rgSlider" role="slider" tabindex="0" aria-label="보수 범위" aria-valuemin="1" aria-valuemax="5"></div>
        <label class="switch"><input type="checkbox" id="rgFullBelow"><i aria-hidden="true"></i>수면 아래 전체 재도장</label>
      </div>
    </section>
    <section class="pane pane-draw" id="paneDraw" aria-label="보수 도면">
      <div class="pane-head">
        <span class="pane-title">보수 도면</span><span class="pane-count" id="drawSub"></span>
      </div>
      <div class="pane-body"></div>
    </section>
    <section class="pane pane-effect" id="paneEffect" aria-label="보수 물량 및 효과">
      <div class="pane-head"><span class="pane-title">보수 물량 및 효과</span></div>
      <div class="pane-body"></div>
    </section>
    <!-- 보수 정보 (SPEC 13.6): 총 N건 (최종 보수 목록 탭일 때만) · [판 정보] [최종 보수 목록]; the exclude button at the bottom -->
    <section class="pane pane-side" id="paneSide" aria-label="보수 정보">
      <div class="pane-head">
        <span class="pane-title">보수 정보</span><span class="pane-count" id="sideCount" hidden></span>
        <div class="seg pane-seg side-tabs" role="group" aria-label="보수 정보 보기">
          <button data-side="plate" aria-pressed="true">판 정보</button>
          <button data-side="list" aria-pressed="false">최종 보수 목록</button>
        </div>
      </div>
      <div class="pane-body"></div>
      <div class="side-foot" hidden></div>
    </section>
  </div>

  <footer class="statusbar">
    <span class="rb idle" id="stRobotWrap"><i></i><span id="stRobot">데이터 불러오는 중…</span></span>
    <button class="help-btn sm" id="csBtn" aria-expanded="false" aria-controls="csPop" aria-label="좌표계" title="좌표계">?</button>
  </footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="pop pop-fixed" id="valPop" role="dialog" aria-label="수치 설명" hidden><div class="lg-row" id="valTxt"></div></div>
<div class="pop pop-fixed" id="actPop" role="dialog" aria-label="권장 조치" hidden><div class="lg-row" id="actTxt"></div></div>
<div class="pop pop-fixed" id="csPop" role="dialog" aria-label="좌표계" hidden>
  <b class="lg-ttl">좌표계·Ship CS</b>
  <div class="lg-row"><b class="cs-k">X</b><span>선수 방향 (+)</span></div>
  <div class="lg-row"><b class="cs-k">Y</b><span>좌현 방향 (+)</span></div>
  <div class="lg-row"><b class="cs-k">Z</b><span>기선에서 위로 (+)</span></div>
  <div class="lg-row"><span>프레임 간격 850 mm</span></div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
